[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-optimizer"
version = "0.1.0"
description = "AI-assisted AWS FinOps cost optimization platform with banking compliance guardrails."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.2",
    "groq>=0.4.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
